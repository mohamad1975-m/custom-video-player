<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>چت‌بات — Inline</title>
  <style>
    @font-face {
      font-family: 'IRANYekanX';
      src: url('https://s34.picofile.com/file/8486538992/IRANYekanX_Light_woff2.html') format('woff2');
      font-weight: 300; font-style: normal; font-display: swap;
    }
    :root { --bg:#0f172a; --card:#0b1223; --radius:18px; }
    *{box-sizing:border-box} html,body{height:100%}
    body{ margin:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
          font-family:'IRANYekanX', Tahoma, sans-serif; color:#e5e7eb; }
    .wrap{ width:min(96vw, 520px); }
    .card{ background:var(--card); border-radius:var(--radius); padding:12px;
           box-shadow:0 12px 30px rgba(0,0,0,.28), 0 2px 10px rgba(0,0,0,.2); }
    zapier-interfaces-chatbot-embed{ width:100%; height:80vh; display:block; border-radius:12px; overflow:hidden; }
    .note{font-size:12px; color:#9ca3af; text-align:center; margin-top:10px;}
  </style>
  <script async type="module" src="https://interfaces.zapier.com/assets/web-components/zapier-interfaces/zapier-interfaces.esm.js"></script>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <zapier-interfaces-chatbot-embed
        is-popup="false"
        chatbot-id="cm1md41aa0009jr5y1g37r8k3"
        height="100%"
        width="100%">
      </zapier-interfaces-chatbot-embed>
    </div>
    <div class="note">اگر «refused to connect» دیدی: صفحه را از روی سرور باز کن (نه file://) و دامنهٔ میزبان را در Allowed domains اضافه کن (localhost هم اگر محلی تست می‌کنی).</div>
  </main>
</body>
</html>
